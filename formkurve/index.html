<style>
/* Formkurve, Glas.
   Fühlt sich an wie eine eingebaute iOS App: Systemschrift, gerundete Zahlen, gruppierte Listen,
   Glasflächen für Navigation und Sheets, Federn statt starrer Übergänge.
   Jeder Bereich hat einen eigenen Farbverlauf (--acc-a nach --acc-b), --acc ist die lesbare Einzelfarbe davon. */
:root {
  --paper: #000000;
  --surface: #1C1C1E;
  --surface-2: #2C2C2E;
  --surface-3: #3A3A3C;
  --fill: rgba(118, 118, 128, .24);
  --fill-2: rgba(118, 118, 128, .36);
  --ink: #FFFFFF;
  --muted: #98989F;
  --line: #38383A;
  --sep: rgba(84, 84, 88, .65);
  --floor: #000000;
  --floor-2: #2C2C2E;
  --floor-ink: #FFFFFF;
  --floor-muted: #98989F;
  --ok: #30D158;
  --warn: #FF453A;
  --mk-e: #64D2FF;
  --mk-k: #FF9F0A;
  --mk-f: #FF375F;
  --shade: rgba(0, 0, 0, .5);
  --glass: rgba(30, 30, 32, .66);
  --glass-strong: rgba(36, 36, 38, .82);
  --glass-edge: rgba(255, 255, 255, .13);
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  --font-round: ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif;
  --r-s: 12px;
  --r-m: 16px;
  --r-l: 24px;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --spring: cubic-bezier(.32, 1.25, .5, 1);
  --ease-sheet: cubic-bezier(.32, .72, 0, 1);
  --tabbar-h: 66px;
  --acc-a: #FF7A1F; --acc-b: #FF2D55; --acc: #FF5A3C; --accent-ink: #FFFFFF;
  color-scheme: dark;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
.b-heute, .b-training { --acc-a: #FF7A1F; --acc-b: #FF2D55; --acc: #FF5A3C; --accent-ink: #FFFFFF; }
.b-mobility { --acc-a: #40B4FF; --acc-b: #0A6CFF; --acc: #3EA6FF; --accent-ink: #FFFFFF; }
.b-cardio { --acc-a: #DA8FFF; --acc-b: #9B4DFF; --acc: #BF7AFF; --accent-ink: #FFFFFF; }
.b-essen { --acc-a: #5FE38A; --acc-b: #30D158; --acc: #30D158; --accent-ink: #032B12; }
.b-verlauf { --acc-a: #FFD60A; --acc-b: #FF9F0A; --acc: #FFB800; --accent-ink: #2B1D00; }
.b-coach { --acc-a: #7D7AFF; --acc-b: #BF5AF2; --acc: #A08CFF; --accent-ink: #FFFFFF; }
:root, .b-heute, .b-training, .b-mobility, .b-cardio, .b-essen, .b-verlauf, .b-coach {
  --accent: var(--acc);
  --grad: linear-gradient(135deg, var(--acc-a), var(--acc-b));
  --acc-glow: color-mix(in srgb, var(--acc) 45%, transparent);
  --acc-soft: color-mix(in srgb, var(--acc) 18%, transparent);
  --acc-line: color-mix(in srgb, var(--acc) 45%, var(--line));
}

/* ===== Grundlagen ===== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { position: fixed; inset: 0; width: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.4; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
button:focus-visible, .feld:focus-visible { outline-color: var(--ink); }
svg { display: block; }
#app { height: 100%; }
::selection { background: color-mix(in srgb, var(--acc) 40%, transparent); color: var(--ink); }
input, textarea { caret-color: var(--acc); }
button, a, label, input, select, textarea, [role=button] { touch-action: manipulation; }
button, .tabs, .woche-tage, .marke, .chip, .laufleiste, svg, img { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

.app { position: relative; height: 100%; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; background: var(--paper); isolation: isolate; }
.screen { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: calc(var(--tabbar-h) + 22px + env(safe-area-inset-bottom)); animation: einblenden .2s var(--ease-out); }
.app:has(.laufleiste) .screen { padding-bottom: calc(var(--tabbar-h) + 86px + env(safe-area-inset-bottom)); }
.inhalt { padding: 4px 16px 28px; display: flex; flex-direction: column; gap: 20px; }
.inhalt > *, .ganz-inhalt > *, .blatt-inhalt > *, .ob-inhalt > *, .spalte > *, .abschnitt > * { flex-shrink: 0; }
.spalte > .marke { align-self: flex-start; }
.kopf { padding: calc(14px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }

/* ===== Typografie ===== */
.d1, .d2, .d3 { font-family: var(--font-display); line-height: 1.08; }
.d1 { font-size: 34px; font-weight: 700; letter-spacing: -.026em; }
.d2 { font-size: 28px; font-weight: 700; letter-spacing: -.022em; }
.d3 { font-size: 20px; font-weight: 600; letter-spacing: -.016em; line-height: 1.15; }
.num, .gross-zahl { font-family: var(--font-round); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; line-height: 1; }
.s { font-size: 15px; letter-spacing: -.008em; }
.xs { font-size: 13px; letter-spacing: -.004em; }
.muted { color: var(--muted); }
.fett { font-weight: 600; }
.tab-num, .makro, .kennzahl, .woche-tage, .diagramm, .marke, .chip, .ganz-kopf h2, .logzeile, .pause, .stufe, .scan-posten, .zeile, .toast, .laufleiste { font-variant-numeric: tabular-nums; }
.zentriert { text-align: center; }
.abschnitt { display: flex; flex-direction: column; gap: 10px; }
.abschnitt > h2, .abschnitt .reihe > h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; }
.reihe { display: flex; align-items: center; gap: 10px; }
.reihe.zw { justify-content: space-between; }
.reihe.oben { align-items: flex-start; }
.wachs { flex: 1; min-width: 0; }
.spalte { display: flex; flex-direction: column; gap: 10px; }
.luecke-s { gap: 6px; }
.luecke-l { gap: 16px; }
.umbruch { flex-wrap: wrap; }
.kuerzen { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Buttons: Kapseln, federnd ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; font-weight: 600; font-size: 17px; line-height: 1.1; text-align: center; background: var(--fill); color: var(--ink); border: 0; transition: transform .3s var(--spring), opacity .2s var(--ease-out), background-color .2s; }
.btn:active { transform: scale(.96); transition-duration: .1s; }
.btn.gelb { background: var(--grad); color: var(--accent-ink); box-shadow: 0 10px 24px -12px var(--acc-b); }
.btn.dunkel { background: var(--ink); color: #000; }
.btn.aufgelb { background: #FFFFFF; color: #000; }
.btn.leise { background: var(--fill); }
.btn.nurtext { background: transparent; color: var(--acc); padding: 0 8px; min-height: 44px; }
.btn.gefahr { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.btn.klein { min-height: 40px; padding: 0 16px; font-size: 15px; white-space: nowrap; }
.btn.voll { width: 100%; }
.btn.btn[disabled] { opacity: 1; background: var(--fill); color: var(--muted); box-shadow: none; pointer-events: none; }
.ib { width: 44px; height: 44px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--ink); flex: none; background: var(--fill); transition: transform .3s var(--spring), background-color .2s; }
.ib.rand { background: var(--fill); }
.ib:active { transform: scale(.9); background: var(--fill-2); transition-duration: .1s; }
.ki-knopf { color: #FFFFFF !important; background: linear-gradient(135deg, #7D7AFF, #BF5AF2) !important; box-shadow: 0 8px 20px -10px #BF5AF2; }

/* ===== Eingaben ===== */
.feld { width: 100%; min-height: 52px; padding: 0 16px; border-radius: var(--r-s); border: 0; background: var(--fill); font-size: 17px; color: var(--ink); transition: box-shadow .2s var(--ease-out); }
textarea.feld { padding: 14px 16px; min-height: 96px; resize: vertical; line-height: 1.4; }
.feld::placeholder { color: var(--muted); opacity: 1; }
.feld:focus { box-shadow: 0 0 0 2px var(--acc); outline: none; }
.feldgruppe { display: flex; flex-direction: column; gap: 8px; }
.feldgruppe > label, .etikett { font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .01em; padding-left: 4px; }
.mit-einheit { position: relative; }
.mit-einheit .feld { padding-right: 62px; }
.mit-einheit .einheit { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
.feld.klein-feld { min-height: 44px; font-size: 16px; font-weight: 600; padding: 0 12px; }

/* ===== Chips, Marken, Auswahl ===== */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.zeile-scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; overscroll-behavior-x: contain; }
.chips.zeile-scroll::-webkit-scrollbar { display: none; }
.chip { min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--fill); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; position: relative; transition: transform .3s var(--spring), background-color .2s, color .2s; }
.chip::after { content: ''; position: absolute; inset: -4px 0; }
.chip:active { transform: scale(.95); transition-duration: .1s; }
.chip.an { background: var(--grad); color: var(--accent-ink); }
.chip.klein { min-height: 32px; padding: 0 12px; font-size: 13px; }
.chip.klein::after { inset: -8px -2px; }
.marke { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--fill); font-size: 13px; font-weight: 600; white-space: nowrap; }
.marke.gelb { background: var(--grad); color: var(--accent-ink); }
.marke.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); border: 0; }
.wahl { display: flex; flex-direction: column; gap: 10px; }
.wahl > button { display: flex; align-items: center; gap: 14px; text-align: left; padding: 14px 16px; min-height: 64px; border-radius: 18px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1.5px transparent; transition: transform .3s var(--spring), box-shadow .2s var(--ease-out), background-color .2s; }
.wahl > button:active { transform: scale(.98); transition-duration: .1s; }
.wahl > button.an { background: color-mix(in srgb, var(--acc) 12%, var(--surface)); box-shadow: inset 0 0 0 2px var(--acc); }
.wahl > button .punkt { width: 24px; height: 24px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 2px var(--surface-3); flex: none; transition: background .2s, box-shadow .2s; position: relative; }
.wahl > button.an .punkt { background: var(--grad); box-shadow: none; }
.wahl > button.an .punkt::after { content: ''; position: absolute; left: 8px; top: 5px; width: 6px; height: 11px; border: solid #FFF; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg); }

/* ===== Karten und gruppierte Listen ===== */
.karte { background: var(--surface); border: 0; border-radius: var(--r-l); padding: 16px; }
.karte.eng { padding: 12px 14px; border-radius: 18px; }
.liste { display: flex; flex-direction: column; }
.inhalt > .liste, .abschnitt > .liste, .ganz-inhalt > .liste:not(:has(.logzeile)), .blatt-inhalt > .liste { background: var(--surface); border-radius: var(--r-l); padding: 0 16px; }
.zeile { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: .5px solid var(--sep); width: 100%; min-height: 60px; text-align: left; }
.liste > .zeile:last-child, .karte .liste .zeile:last-child { border-bottom: 0; }
.zeile .titel { font-weight: 600; }
.zeile .pfeil { color: #5A5A5F; flex: none; }
.zeile .pfeil svg { width: 18px; height: 18px; }
.karte .zeile:first-child { padding-top: 4px; }
.karte .zeile:last-child { padding-bottom: 4px; }
button.zeile { transition: opacity .2s var(--ease-out); }
button.zeile:active { opacity: .55; transition-duration: .08s; }
.zeile.b-mobility .titel, .zeile.b-cardio .titel, .zeile.b-essen .titel, .zeile.b-verlauf .titel { display: inline-flex; align-items: center; gap: 10px; }
.zeile.b-mobility .titel::before, .zeile.b-cardio .titel::before, .zeile.b-essen .titel::before, .zeile.b-verlauf .titel::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 4px var(--acc-soft); }
.leer { padding: 18px; border: 0; border-radius: var(--r-m); background: var(--surface); color: var(--muted); }

/* Hauptaktion: Verlaufskarte wie im Glas Entwurf */
.aktion { position: relative; overflow: hidden; isolation: isolate; background: var(--grad); color: var(--accent-ink); border-radius: 26px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 22px 44px -26px var(--acc-b); }
.aktion::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(120% 90% at 100% 0%, rgba(255, 255, 255, .32), transparent 55%); pointer-events: none; }
.aktion .d2 { font-size: 34px; letter-spacing: -.028em; }
.aktion .muted { color: var(--accent-ink); opacity: .82; }
.aktion .btn:not(.gelb):not(.dunkel):not(.aufgelb) { background: #FFFFFF; color: #000; }
.aktion .btn.gelb { background: #FFFFFF; color: #000; box-shadow: none; }
.aktion .balken { background: rgba(0, 0, 0, .18); }
.aktion .balken > i { background: var(--accent-ink); box-shadow: none; }
.aktion.ruhig { background: var(--surface); color: var(--ink); border: 0; box-shadow: none; }
.aktion.ruhig::before { background: radial-gradient(90% 70% at 100% 0%, color-mix(in srgb, var(--acc-b) 30%, transparent), transparent 60%); }
.aktion.ruhig .muted { color: var(--muted); opacity: 1; }
.aktion.ruhig .btn:not(.gelb) { background: var(--fill); color: var(--ink); }
.aktion.ruhig .btn.gelb { background: var(--grad); color: var(--accent-ink); }

/* ===== Kopfbereich Heute mit Woche ===== */
.boden { background: transparent; color: var(--ink); padding: calc(14px + env(safe-area-inset-top)) 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.boden > .reihe:first-child { padding: 0 4px; }
.boden .muted { color: var(--muted); }
.boden > .reihe:first-child > div:first-child { display: flex; flex-direction: column; }
.boden > .reihe:first-child p.muted { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .01em; order: -1; margin-bottom: 2px; }
.boden .ib { color: var(--ink); background: var(--fill); }
.woche { position: relative; margin-top: 4px; }
.woche svg { width: 100%; height: 64px; overflow: visible; }
.woche-tage { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.woche-tage button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 16px; color: var(--muted); min-height: 64px; transition: transform .3s var(--spring), background-color .2s; }
.woche-tage button:active { transform: scale(.92); transition-duration: .1s; }
.woche-tage button .wt { font-size: 12px; font-weight: 600; }
.woche-tage button .tg { font-family: var(--font-round); font-weight: 600; font-size: 18px; line-height: 1; color: var(--ink); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; }
.woche-tage button .mk { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid transparent; }
.woche-tage button .mk.plan { border-color: var(--surface-3); }
.woche-tage button .mk.fertig { background: var(--grad); border-color: transparent; }
.woche-tage button.gewaehlt { background: var(--surface); }
.woche-tage button.heute .tg { background: var(--grad); color: var(--accent-ink); }
.woche-tage button.heute { color: var(--acc); }

/* ===== Fortschrittsbalken ===== */
.balken { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.balken > i { display: block; height: 100%; border-radius: 3px; background: var(--grad); transition: width .5s var(--ease-out); }
.balken.gelb > i { background: var(--grad); }
.balken.e > i { background: var(--mk-e); }
.balken.k > i { background: var(--mk-k); }
.balken.f > i { background: var(--mk-f); }
.balken.drueber > i { background: var(--warn); }
.balken.dick { height: 10px; border-radius: 5px; }
.balken.dick > i { border-radius: 5px; }

/* ===== Tab Leiste: schwebende Glaskapsel ===== */
.tabs { position: absolute; z-index: 15; left: 14px; right: 14px; bottom: calc(8px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 6px; border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 18px 40px -18px rgba(0, 0, 0, .9); }
.tabs button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; border-radius: 999px; color: var(--ink); font-size: 10.5px; font-weight: 600; letter-spacing: 0; transition: transform .3s var(--spring), background-color .25s, color .25s; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button.an { color: var(--acc); background: rgba(255, 255, 255, .1); }
.tabs button:active { transform: scale(.9); transition-duration: .1s; }

/* Laufendes Training als schwebende Leiste über den Tabs */
.laufleiste { position: absolute; z-index: 14; left: 14px; right: 14px; bottom: calc(8px + var(--tabbar-h) + 10px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px; min-height: 56px; border-radius: 999px; color: var(--ink); background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 14px 34px -16px rgba(0, 0, 0, .9); border: 0; width: auto; transition: transform .3s var(--spring); }
.laufleiste::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--grad); flex: none; animation: puls 1.6s ease-in-out infinite; }
.laufleiste .muted { color: var(--muted); }
.laufleiste:active { transform: scale(.97); transition-duration: .1s; }

/* ===== Segmente ===== */
.seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); overflow-x: auto; scrollbar-width: none; border: 0; overscroll-behavior-x: contain; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: 1 0 auto; position: relative; padding: 0 14px; min-height: 40px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--ink); white-space: nowrap; text-align: center; transition: background-color .25s var(--ease-out), color .25s, transform .3s var(--spring); }
.seg button.an { background: var(--surface-3); box-shadow: 0 3px 8px rgba(0, 0, 0, .35); }
.seg button:active { transform: scale(.95); transition-duration: .1s; }
.umschalter { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 12px; padding: 3px; gap: 2px; }
.umschalter button { min-height: 44px; border-radius: 10px; font-weight: 600; font-size: 15px; text-align: center; color: var(--ink); padding: 0 6px; transition: background-color .25s var(--ease-out), transform .3s var(--spring); }
.umschalter button.an { background: var(--surface-3); box-shadow: 0 3px 8px rgba(0, 0, 0, .35); }
.umschalter button:active { transform: scale(.96); transition-duration: .1s; }

/* ===== Sheets, Vollbild, Dialoge ===== */
.ebene { display: contents; }
.ebene-bg { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; background: transparent; }
.ebene-bg::before { content: ''; position: absolute; inset: 0; background: var(--shade); animation: einblenden .32s var(--ease-out); }
.ebene-bg > * { position: relative; }
.blatt { width: calc(100% - 16px); margin: 0 8px calc(8px + env(safe-area-inset-bottom) * .3); max-height: calc(100% - env(safe-area-inset-top) - 20px); background: var(--glass-strong); -webkit-backdrop-filter: blur(36px) saturate(180%); backdrop-filter: blur(36px) saturate(180%); border-radius: 36px; border: 0; box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 -10px 50px -10px rgba(0, 0, 0, .7); padding-bottom: calc(env(safe-area-inset-bottom) * .7); display: flex; flex-direction: column; animation: sheet-hoch .5s var(--spring); }
.blatt::before { content: ''; flex: none; width: 36px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .26); margin: 8px auto 0; }
.blatt-kopf { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 12px 6px 22px; }
.blatt-kopf h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.15; letter-spacing: -.02em; }
.blatt-inhalt { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 18px 22px; display: flex; flex-direction: column; gap: 18px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.blatt-inhalt > .liste { background: var(--fill); }
.blatt .karte, .blatt .wahl > button, .blatt .leer, .blatt .scan-feld, .blatt .coach-karte, .blatt .scan-leiste { background: var(--fill); }
.blatt-fuss { flex: none; padding: 10px 18px 14px; border-top: 0; background: transparent; display: flex; gap: 10px; }
.ganz { position: absolute; inset: 0; z-index: 20; padding-bottom: env(safe-area-inset-bottom); background: var(--paper); display: flex; flex-direction: column; animation: hochfahren .38s var(--spring); }
.ganz-kopf { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px 12px; }
.ganz-kopf h2 { flex: 1; min-width: 0; font-weight: 600; font-size: 17px; letter-spacing: -.02em; }
.ganz-inhalt { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 20px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.ganz-fuss { flex: none; padding: 10px 16px 12px; border-top: 0; display: flex; gap: 10px; background: linear-gradient(to top, var(--paper) 60%, transparent); }
.dialog-bg { position: absolute; inset: 0; z-index: 60; background: var(--shade); display: flex; align-items: center; justify-content: center; padding: 28px; animation: einblenden .2s var(--ease-out); }
.dialog { width: 100%; max-width: 330px; background: var(--glass-strong); -webkit-backdrop-filter: blur(36px) saturate(180%); backdrop-filter: blur(36px) saturate(180%); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 30px 60px -20px rgba(0, 0, 0, .8); border-radius: 30px; padding: 22px; display: flex; flex-direction: column; gap: 14px; animation: dialog-auf .35s var(--spring); }
.dialog .btn { min-height: 48px; }
.toast { position: absolute; left: 18px; right: 18px; top: calc(10px + env(safe-area-inset-top)); bottom: auto; z-index: 70; display: flex; justify-content: center; pointer-events: none; }
.toast > div { background: var(--glass-strong); -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 14px 30px -12px rgba(0, 0, 0, .8); color: var(--ink); padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; max-width: 100%; animation: toast-auf .45s var(--spring); }

@keyframes einblenden { 0% { opacity: 0; } to { opacity: 1; } }
@keyframes hochfahren { 0% { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sheet-hoch { from { transform: translateY(105%); } to { transform: none; } }
@keyframes dialog-auf { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toast-auf { from { opacity: 0; transform: translateY(-14px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes puls { 0%, to { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
@keyframes zeichnen { to { stroke-dashoffset: 0; } }
@keyframes aura { 0%, to { transform: translate3d(0, 0, 0) scale(1); } 50% { transform: translate3d(-4%, 3%, 0) scale(1.08); } }

/* ===== Training ===== */
.zaehler { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.zaehler .wert { display: flex; align-items: baseline; justify-content: center; gap: 6px; width: 100%; }
.zaehler input { width: 100%; min-width: 0; text-align: center; border: 0; background: transparent; padding: 0; font-family: var(--font-round); font-weight: 700; font-size: 68px; line-height: 1; letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: inherit; border-bottom: 2px solid transparent; border-radius: 0; }
.zaehler input:focus { outline: none; border-bottom-color: var(--acc); }
.zaehler .einh { font-weight: 600; color: var(--muted); font-size: 15px; }
.zaehler .tasten { display: grid; grid-template-columns: 1fr 1fr; width: 100%; background: var(--fill); border-radius: 16px; overflow: hidden; position: relative; }
.zaehler .tasten::after { content: ''; position: absolute; left: 50%; top: 14px; bottom: 14px; width: 1px; background: var(--sep); }
.zaehler .tasten button { height: 54px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; border-radius: 0; transition: background-color .15s; }
.zaehler .tasten button:active { background: var(--fill-2); }
.zaehler.mittel input { font-size: 46px; }
.zaehler.mittel .tasten button { height: 48px; }
.stufe { display: flex; align-items: center; gap: 10px; }
.stufe .w { min-width: 84px; text-align: center; font-family: var(--font-round); font-weight: 700; font-size: 26px; font-variant-numeric: tabular-nums; }
.stufe button { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--fill); display: flex; align-items: center; justify-content: center; flex: none; transition: transform .3s var(--spring); }
.stufe button:active { transform: scale(.9); transition-duration: .1s; }
.schiene { display: flex; gap: 4px; padding: 0 16px 4px; }
.schiene i { flex: 1; height: 4px; border-radius: 2px; background: var(--fill); transition: background .3s; }
.schiene i.fertig { background: color-mix(in srgb, var(--acc) 55%, var(--surface-2)); }
.schiene i.jetzt { background: var(--grad); }
.satzkarte { position: relative; isolation: isolate; overflow: hidden; background: var(--surface); border: 0; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.satzkarte::before { content: ''; position: absolute; z-index: -1; inset: -40% -30% auto auto; width: 90%; height: 120%; background: radial-gradient(closest-side, color-mix(in srgb, var(--acc-b) 17%, transparent), transparent); pointer-events: none; }
.satzkarte .paar { display: flex; align-items: flex-start; gap: 10px; }
.satzkarte .mal { font-family: var(--font-round); font-weight: 600; font-size: 30px; color: var(--muted); padding-top: 16px; flex: none; }
.rir { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rir button { min-height: 52px; border-radius: 14px; border: 0; background: var(--fill); font-family: var(--font-round); font-weight: 700; font-size: 18px; text-align: center; transition: transform .3s var(--spring), background-color .2s; }
.rir button:active { transform: scale(.92); transition-duration: .1s; }
.rir button.an { background: var(--grad); color: var(--accent-ink); }
.logzeile { display: grid; grid-template-columns: 28px 1fr auto 28px; align-items: center; gap: 12px; padding: 12px 0; border-bottom: .5px solid var(--sep); width: 100%; min-height: 56px; text-align: left; }
.liste > .logzeile:last-child { border-bottom: 0; }
button.logzeile { transition: opacity .2s; }
button.logzeile:active { opacity: .55; transition-duration: .08s; }
.ganz-inhalt > .liste:has(.logzeile) { background: var(--surface); border-radius: var(--r-l); padding: 0 16px; }
.logzeile .nr { font-family: var(--font-round); font-weight: 600; font-size: 17px; color: var(--muted); }
.logzeile .lw { font-family: var(--font-round); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.logzeile.offen { color: var(--muted); }
.logzeile.offen .lw { font-weight: 500; color: var(--muted); font-family: var(--font-body); font-size: 17px; }
.logzeile.jetzt .nr, .logzeile.jetzt .lw { color: var(--acc); }
.haken { width: 26px; height: 26px; border-radius: 50%; background: var(--grad); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; animation: haken-pop .5s var(--spring); }
@keyframes haken-pop { 0% { transform: scale(.3); } }
.pause { flex: none; position: relative; overflow: hidden; isolation: isolate; margin: 0 10px 8px; padding: 14px 16px; border-radius: 28px; background: var(--surface-2); box-shadow: inset 0 0 0 .5px var(--glass-edge), 0 18px 40px -16px rgba(0, 0, 0, .9); color: var(--ink); display: flex; flex-direction: column; gap: 12px; border: 0; animation: hochfahren .45s var(--spring); }
.pause::before { content: ''; position: absolute; inset: 0; z-index: -1; background: radial-gradient(80% 120% at 0% 0%, color-mix(in srgb, var(--acc-a) 22%, transparent), transparent 60%); }
.pause .num { font-size: 56px; letter-spacing: -.04em; }
.pause .balken { background: var(--fill); height: 6px; }
.pause .balken > i { background: var(--grad); transition: width 1s linear; }
.pause .btn { background: var(--fill); color: var(--ink); border: 0; }
.pause .btn:last-child { background: var(--grad); color: var(--accent-ink); }
.hinweisbox { background: var(--acc-soft); border: 0; border-radius: 18px; padding: 12px 14px; font-size: 15px; }
.scheiben { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; }
.scheiben .stange { height: 6px; width: 16px; background: var(--muted); border-radius: 3px; }
.scheibe { display: inline-flex; align-items: center; justify-content: center; border-radius: 7px; width: 30px; font-size: 11.5px; font-weight: 700; color: #FFF; font-family: var(--font-round); }
.scheibe.s25 { height: 46px; background: #E5383B; }
.scheibe.s20 { height: 46px; background: #2F6FE4; }
.scheibe.s15 { height: 42px; background: #F5B700; color: #1D1A05; }
.scheibe.s10 { height: 36px; background: #22A061; }
.scheibe.s5 { height: 30px; background: #F2F2F7; color: #1D1A05; }
.scheibe.s2_5 { height: 26px; background: #48484A; }
.scheibe.s1_25 { height: 22px; background: #8E8E93; color: #1D1A05; }

/* ===== Diagramme und Körperkarte ===== */
.diagramm { width: 100%; }
.diagramm text { font-family: var(--font-body); font-size: 11.5px; fill: var(--muted); letter-spacing: 0; }
.diagramm .gitter { stroke: var(--sep); stroke-width: 1; stroke-dasharray: 2 4; }
.diagramm .linie { fill: none; stroke: var(--acc); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: none; }
.diagramm .flaeche { fill: var(--acc); opacity: .16; }
.diagramm .pkt { fill: var(--surface); stroke: var(--acc); stroke-width: 2; }
.diagramm .ende { fill: var(--surface); stroke: var(--acc); stroke-width: 3.5; filter: none; }
.diagramm .ziel { stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 4 5; }
.diagramm .saeule { fill: var(--surface-2); rx: 6px; }
.diagramm .saeule.akt { fill: var(--acc); filter: none; }
.diagramm .wertlabel { font-weight: 700; fill: var(--ink); font-size: 12.5px; paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; font-family: var(--font-round); }
.koerper .basis { fill: var(--surface-2); stroke: var(--surface-2); }
.koerper .haupt { fill: var(--accent); stroke: var(--accent); }
.koerper .neben { fill: color-mix(in srgb, var(--accent) 42%, var(--surface-2)); stroke: color-mix(in srgb, var(--accent) 42%, var(--surface-2)); }
.koerper path, .koerper polygon, .koerper rect { stroke-width: 2.4; stroke-linejoin: round; }
.koerper text { font-family: var(--font-body); font-size: 9px; fill: var(--muted); text-anchor: middle; }

/* ===== Essen ===== */
.makro { display: flex; flex-direction: column; gap: 6px; }
.makro .kopfz { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; }
.makro .kopfz > span:first-child { font-weight: 600; }
.punktfarbe { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.punktfarbe.e { background: var(--mk-e); }
.punktfarbe.k { background: var(--mk-k); }
.punktfarbe.f { background: var(--mk-f); }
.kennzahlen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.kennzahl { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-radius: 20px; padding: 14px; }
.kennzahl .num { font-size: 22px; white-space: nowrap; }
.kennzahl.mk { border-top: 0; padding-top: 14px; position: relative; }
.kennzahl.mk::before { content: ''; width: 22px; height: 5px; border-radius: 3px; background: var(--surface-3); margin-bottom: 6px; }
.kennzahl.mk.e::before { background: var(--mk-e); }
.kennzahl.mk.k::before { background: var(--mk-k); }
.kennzahl.mk.f::before { background: var(--mk-f); }
.karte .kennzahl, .blatt .kennzahl { background: transparent; padding: 0; border-radius: 0; }
.karte .kennzahl.mk, .blatt .kennzahl.mk { padding-top: 0; }
.gross-zahl { font-size: 64px; letter-spacing: -.045em; }

/* ===== Onboarding und Laden ===== */
.ob { height: 100%; display: flex; flex-direction: column; }
.ob-kopf, .lade { position: relative; isolation: isolate; overflow: hidden; }
.ob-kopf { color: var(--ink); background: transparent; padding: calc(22px + env(safe-area-inset-top)) 22px 18px; border-radius: 0; display: flex; flex-direction: column; gap: 10px; }
.ob-kopf::before, .lade::before { content: ''; position: absolute; z-index: -1; left: -30%; right: -30%; top: -40%; height: 130%; background: radial-gradient(40% 45% at 30% 50%, color-mix(in srgb, var(--acc-a) 70%, transparent), transparent 70%), radial-gradient(45% 50% at 75% 45%, color-mix(in srgb, var(--acc-b) 70%, transparent), transparent 70%); opacity: .55; pointer-events: none; }
.ob-kopf .muted, .lade .muted { color: rgba(255, 255, 255, .72); }
.ob-kopf .marke-wort, .lade .marke-wort { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1; letter-spacing: -.035em; }
.ob-kopf svg, .lade svg { width: 100%; height: auto; overflow: visible; }
.ob-kopf svg path:nth-child(1), .lade svg path:nth-child(1) { stroke: rgba(255, 255, 255, .18); }
.ob-kopf svg path:nth-child(2), .lade svg path:nth-child(2) { stroke: #FFFFFF; filter: drop-shadow(0 0 10px rgba(255, 255, 255, .45)); }
.ob-kopf svg circle, .lade svg circle { fill: #FFFFFF; }
.ganz-inhalt > .ob-kopf { overflow: visible; isolation: auto; }
.ganz-inhalt > .ob-kopf::before { top: -60%; height: 220%; opacity: .5; }
.kurve-zeichnen { stroke-dasharray: 1; stroke-dashoffset: 1; animation: zeichnen 1.5s .15s cubic-bezier(.3, .1, .2, 1) forwards; }
.kurve-punkt { opacity: 0; animation: einblenden .3s 1.45s ease forwards; }
.ob-inhalt { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 20px; overscroll-behavior: contain; }
.ob-fuss { flex: none; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; border-top: 0; }
.ob-schritte { display: flex; gap: 5px; }
.ob-schritte i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .18); transition: background .3s; }
.ob-schritte i.an { background: #FFFFFF; box-shadow: none; }
.tagwahl { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.tagwahl button { min-height: 52px; border-radius: 14px; border: 0; background: var(--fill); font-weight: 600; text-align: center; transition: transform .3s var(--spring), background-color .2s; }
.tagwahl button:active { transform: scale(.92); transition-duration: .1s; }
.tagwahl button.an { background: var(--grad); color: var(--accent-ink); }
.lade { height: 100%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 12px; padding: 28px; background: var(--paper); color: var(--ink); }

/* ===== KI Coach und Foto Scan ===== */
.ki-symbol { width: 58px; height: 58px; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: #FFFFFF; background: linear-gradient(135deg, #7D7AFF, #BF5AF2); border: 0; box-shadow: 0 10px 24px -12px #BF5AF2; }
.ki-symbol.klein { width: 40px; height: 40px; border-radius: 12px; }
.coach-karte, .scan-leiste { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: var(--r-l); background: var(--surface); border: 0; transition: transform .3s var(--spring); }
.coach-karte:active, .scan-leiste:active, .scan-feld:active, .impuls:active { transform: scale(.97); transition-duration: .1s; }
.coach-karte .pfeil { color: #5A5A5F; }
.scan-leiste { border-radius: 18px; }
.ki-btn { color: var(--ink); background: var(--fill); flex: none; }
.ki-btn svg { color: var(--acc); }
.impuls { text-align: left; padding: 13px 16px; border-radius: 18px; border: 0; background: var(--surface); font-weight: 600; transition: transform .3s var(--spring), background-color .2s; }
.blase { max-width: 84%; padding: 10px 14px; border-radius: 20px; line-height: 1.4; flex-shrink: 0; }
.blase.ich { align-self: flex-end; background: linear-gradient(135deg, #7D7AFF, #9B5CF2); color: #FFFFFF; border-bottom-right-radius: 6px; font-weight: 500; white-space: pre-wrap; }
.blase.ki { align-self: flex-start; background: var(--surface); border-left: 0; border-radius: 20px; border-bottom-left-radius: 6px; padding: 12px 14px; max-width: 92%; }
.ki-text { display: flex; flex-direction: column; gap: 8px; }
.ki-text ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.ki-text b { color: var(--ink); }
.denkt { color: var(--muted); font-weight: 600; }
.denkt::after { content: ''; display: inline-block; width: 8px; height: 8px; margin-left: 10px; border-radius: 50%; background: var(--grad); animation: puls 1s ease-in-out infinite; }
.scan-feld { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 26px 20px; border-radius: var(--r-l); text-align: left; border: 1.5px dashed rgba(255, 255, 255, .16); background: var(--surface); transition: transform .3s var(--spring); }
.scan-foto { width: 100%; max-height: 260px; object-fit: cover; border-radius: var(--r-l); border: 0; outline: 1px solid rgba(255, 255, 255, .1); outline-offset: -1px; flex-shrink: 0; }
.scan-posten { display: flex; gap: 12px; padding: 14px 0; border-bottom: .5px solid var(--sep); align-items: flex-start; }
.scan-posten.aus { opacity: .45; }
.haken-wahl { width: 28px; height: 28px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 2px var(--surface-3); display: inline-flex; align-items: center; justify-content: center; flex: none; margin-top: 10px; position: relative; transition: transform .3s var(--spring), background .2s; }
.haken-wahl::after { content: ''; position: absolute; inset: -10px; }
.haken-wahl:active { transform: scale(.9); transition-duration: .1s; }
.haken-wahl.an { background: var(--grad); box-shadow: none; color: var(--accent-ink); }
.mini-stufe { display: inline-flex; align-items: center; gap: 10px; }
.mini-stufe button { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--fill); display: inline-flex; align-items: center; justify-content: center; position: relative; transition: transform .3s var(--spring); }
.mini-stufe button::after { content: ''; position: absolute; inset: -6px; }
.mini-stufe button:active { transform: scale(.9); transition-duration: .1s; }

/* ===== Druck ohne Bewegung für deaktivierte Elemente ===== */
button:disabled:active, .btn[disabled]:active { transform: none; }
@media (hover: hover) and (pointer: fine) {
  .impuls:hover, .coach-karte:hover, .scan-leiste:hover { background: var(--surface-2); }
  .btn.leise:hover, .ib:hover, .chip:not(.an):hover { background: var(--fill-2); }
}

/* ===== Barrierefreiheit ===== */
@media (prefers-reduced-transparency: reduce) {
  .tabs, .laufleiste, .blatt, .dialog, .toast > div, .pause { background: var(--surface-2); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  :root { --muted: #C7C7CC; --sep: rgba(140, 140, 146, .9); --fill: rgba(118, 118, 128, .4); }
  .tabs, .laufleiste, .blatt, .dialog { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .kurve-zeichnen { stroke-dashoffset: 0; }
  .kurve-punkt { opacity: 1; }
}
@media (min-width: 560px) {
  body { background: #0A0A0B; }
  .app { box-shadow: 0 0 0 .5px var(--line); }
}

/* ===== Feinschliff: Umbruch, Scroll-Performance ===== */
h1, h2, h3, .ob-kopf h1, .ganz-kopf h2 { text-wrap: balance; }
p, .klein, .zeile small, .leer, .hinweis { text-wrap: pretty; }
.screen, .ganz-inhalt, .blatt-inhalt, .ob-inhalt { overscroll-behavior-y: contain; overscroll-behavior-x: none; }
.tabs, .laufleiste { transform: translateZ(0); }
.zeile .wachs, .zeile .titel { overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.zeile .stufe { gap: 6px; flex: none; }
.zeile .stufe .w { min-width: 66px; font-size: 22px; }
.zeile .stufe button { width: 42px; height: 42px; }
.app { text-wrap: pretty; }

/* ===== KI Foto Scan: Scanner ===== */
.scan-rahmen { position: relative; flex-shrink: 0; border-radius: var(--r-l); overflow: hidden; isolation: isolate; }
.scan-rahmen .scan-foto { display: block; }
.scan-rahmen.scannt::before { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: linear-gradient(rgba(0, 0, 0, .28), rgba(0, 0, 0, .28)),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .06) 0 1px, transparent 1px 22px);
  animation: einblenden .4s var(--ease-out); }
.scan-rahmen.scannt::after { content: ''; position: absolute; inset: 14px; z-index: 3; pointer-events: none; --e: rgba(255, 255, 255, .95);
  background:
    linear-gradient(var(--e), var(--e)) left top / 26px 3px no-repeat, linear-gradient(var(--e), var(--e)) left top / 3px 26px no-repeat,
    linear-gradient(var(--e), var(--e)) right top / 26px 3px no-repeat, linear-gradient(var(--e), var(--e)) right top / 3px 26px no-repeat,
    linear-gradient(var(--e), var(--e)) left bottom / 26px 3px no-repeat, linear-gradient(var(--e), var(--e)) left bottom / 3px 26px no-repeat,
    linear-gradient(var(--e), var(--e)) right bottom / 26px 3px no-repeat, linear-gradient(var(--e), var(--e)) right bottom / 3px 26px no-repeat;
  animation: scan-ecken 1.6s ease-in-out infinite; }
.scan-linie { position: absolute; left: 0; right: 0; top: 0; height: 100%; z-index: 2; pointer-events: none; will-change: transform;
  background: linear-gradient(to bottom, transparent 55%, color-mix(in srgb, var(--acc-a) 30%, transparent) 92%, color-mix(in srgb, var(--acc-a) 70%, transparent) 100%);
  animation: scan-lauf 2.1s cubic-bezier(.45, 0, .55, 1) infinite; }
.scan-linie::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; border-radius: 2px;
  background: linear-gradient(90deg, transparent, #FFFFFF 18%, #FFFFFF 82%, transparent);
  box-shadow: 0 0 14px 3px var(--acc-a), 0 0 34px 6px color-mix(in srgb, var(--acc-a) 55%, transparent); }
@keyframes scan-lauf { 0% { transform: translate3d(0, -100%, 0); opacity: 0; } 8% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate3d(0, 0, 0); opacity: 0; } }
@keyframes scan-ecken { 0%, 100% { transform: scale(1); opacity: .95; } 50% { transform: scale(.97); opacity: .7; } }
@media (prefers-reduced-motion: reduce) { .scan-linie { animation: none; transform: translate3d(0, -40%, 0); } .scan-rahmen.scannt::after { animation: none; } }

/* ===== Übungen per Ziehen sortieren ===== */
.liste > .zeile-zug { position: relative; display: flex; align-items: center; margin: 0 -16px; padding: 0 4px 0 16px; border-radius: 16px; }
.liste > .zeile-zug::after { content: ''; position: absolute; left: 16px; right: 16px; bottom: 0; border-bottom: .5px solid var(--sep); }
.liste > .zeile-zug:last-child::after { display: none; }
.zeile-zug > .zeile { flex: 1; min-width: 0; border-bottom: 0; }
.griff { flex: none; width: 44px; height: 52px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.griff::before { content: ''; width: 18px; height: 12px; opacity: .8;
  background: linear-gradient(currentColor, currentColor) 0 0 / 100% 2px no-repeat, linear-gradient(currentColor, currentColor) 0 50% / 100% 2px no-repeat, linear-gradient(currentColor, currentColor) 0 100% / 100% 2px no-repeat; }
.sortiert > .zeile-zug:not(.zieht) { transition: transform .26s var(--ease-out); }
.zeile-zug.zieht { z-index: 5; background: var(--surface-2); box-shadow: 0 16px 34px -12px rgba(0, 0, 0, .6), inset 0 0 0 .5px var(--glass-edge); }
.zeile-zug.zieht::after { display: none; }
.zeile-zug.zieht .griff { cursor: grabbing; color: var(--acc); }
body.am-ziehen { user-select: none; -webkit-user-select: none; }

<script>
/* Formkurve Extras: Hell/Dunkel Umschaltung und Sortieren per Ziehen. */
(function () {
  var KEY = 'fk1x.design';
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  function get() { try { return localStorage.getItem(KEY) || 'dark'; } catch (e) { return 'dark'; } }
  function apply() {
    var m = get(), hell = m === 'light' || (m === 'auto' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', hell ? 'light' : 'dark');
    var tc = document.querySelector('meta[name="theme-color"]');
    if (tc) tc.setAttribute('content', hell ? '#F2F2F7' : '#000000');
  }
  function set(m) {
    try { localStorage.setItem(KEY, m); } catch (e) {}
    var root = document.documentElement;
    root.classList.add('design-wechsel');
    apply();
    setTimeout(function () { root.classList.remove('design-wechsel'); }, 400);
  }
  if (mq) { var f = function () { if (get() === 'auto') apply(); }; mq.addEventListener ? mq.addEventListener('change', f) : mq.addListener(f); }
  apply();
  window.fkDesign = { get: get, set: set, apply: apply };

  /* Ziehen zum Sortieren. Aufruf aus onPointerDown eines .griff in einer .zeile-zug.
     fertig(von, nach) wird nur aufgerufen, wenn sich die Position geändert hat. */
  window.fkZiehen = function (ev, fertig) {
    if (ev.button > 0) return;
    var griff = ev.currentTarget, row = griff.closest('.zeile-zug');
    if (!row) return;
    var list = row.parentElement;
    var rows = [].filter.call(list.children, function (c) { return c.classList.contains('zeile-zug'); });
    var from = rows.indexOf(row);
    if (from < 0 || rows.length < 2) return;
    ev.preventDefault();
    try { griff.setPointerCapture(ev.pointerId); } catch (e) {}
    var sc = list;
    while (sc && sc !== document.body && !/(auto|scroll)/.test(getComputedStyle(sc).overflowY)) sc = sc.parentElement;
    var rects = rows.map(function (r) { return r.getBoundingClientRect(); });
    var h = rects[from].height;
    var startY = ev.clientY, startScroll = sc ? sc.scrollTop : 0, lastY = startY, to = from, raf = 0, aktiv = true;
    var buzz = function (ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
    row.classList.add('zieht'); list.classList.add('sortiert'); document.body.classList.add('am-ziehen');
    buzz(8);
    function update() {
      var dy = lastY - startY + ((sc ? sc.scrollTop : 0) - startScroll);
      var minDy = rects[0].top - rects[from].top, maxDy = rects[rows.length - 1].top - rects[from].top;
      dy = Math.max(minDy - 12, Math.min(maxDy + 12, dy));
      row.style.transform = 'translate3d(0,' + dy + 'px,0) scale(1.02)';
      var center = rects[from].top + h / 2 + dy, n = 0;
      for (var i = 0; i < rows.length; i++) { if (i !== from && center > rects[i].top + rects[i].height / 2) n++; }
      if (n !== to) { to = n; buzz(4); }
      rows.forEach(function (r, i) {
        if (i === from) return;
        var s = 0;
        if (from < to && i > from && i <= to) s = -h;
        if (from > to && i >= to && i < from) s = h;
        r.style.transform = s ? 'translate3d(0,' + s + 'px,0)' : '';
      });
    }
    function loop() {
      if (!aktiv) return;
      if (sc) {
        var b = sc.getBoundingClientRect(), rand = 70, v = 0;
        if (lastY < b.top + rand) v = -Math.ceil((b.top + rand - lastY) / 6);
        else if (lastY > b.bottom - rand) v = Math.ceil((lastY - (b.bottom - rand)) / 6);
        if (v) sc.scrollTop += v;
      }
      update();
      raf = requestAnimationFrame(loop);
    }
    function move(e) { lastY = e.clientY; }
    function ende() {
      aktiv = false; cancelAnimationFrame(raf);
      griff.removeEventListener('pointermove', move);
      griff.removeEventListener('pointerup', ende);
      griff.removeEventListener('pointercancel', ende);
      list.classList.remove('sortiert');
      rows.forEach(function (r) { r.style.transform = ''; });
      row.classList.remove('zieht'); document.body.classList.remove('am-ziehen');
      if (to !== from) { buzz(10); fertig(from, to); }
    }
    griff.addEventListener('pointermove', move);
    griff.addEventListener('pointerup', ende);
    griff.addEventListener('pointercancel', ende);
    raf = requestAnimationFrame(loop);
  };
})();
